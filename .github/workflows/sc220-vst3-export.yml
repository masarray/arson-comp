name: SC220 integration VST3 reproducible binary export
on:
  push:
    branches: ['integration/sc220-vst3-export-v020']
    paths: ['.github/workflows/sc220-vst3-export.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sc220-arsoncomp-export
  cancel-in-progress: false

jobs:
  export-reproducible-vst3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin previous successful Windows CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_status=$(gh api repos/masarray/arson-comp/actions/runs/41287176421 --jq '.conclusion')
          run_sha=$(gh api repos/masarray/arson-comp/actions/runs/41287176421 --jq '.head_sha')
          [[ "$run_status" == "success" ]] || { echo "Original VST3 build was not successful"; exit 1; }
          [[ "$run_sha" == "b1a8452a238bb237215788ed71b19e6e9d6c5f68" ]] || { echo "Source changed; rebuild required"; exit 1; }
          gh run download 41287176421 --repo masarray/arson-comp --name 'ArSonComp-Windows-x64-ReadyToTest' --dir from-audited-ci
      - name: Verify actual VST3 module, package exact binary and AGPL notice
        shell: bash
        run: |
          set -euo pipefail
          bundle='from-audited-ci/Plugin/ArSonComp.vst3'
          test -d "$bundle"
          module=$(find "$bundle" -type f -iname '*.vst3' -print -quit)
          test -n "$module"
          test "$(stat -c '%s' "$module")" -gt 100000
          mkdir -p stage
          cp -a "$bundle" 'stage/ArSonComp.vst3'
          cp LICENSE 'stage/AGPL-3.0-LICENSE.txt'
          cat > stage/PROVENANCE.txt <<EOF
          Plugin: ArSonComp (independent AGPL-3.0 VST3)
          Source repository: https://github.com/masarray/arson-comp
          Binary build commit: b1a8452a238bb237215788ed71b19e6e9d6c5f68
          Binary Windows CI run: https://github.com/masarray/arson-comp/actions/runs/41287176421
          Artifact: ArSonComp-Windows-x64-ReadyToTest
          Windows: x64
          SC220 Live host integration: optional separate plugin, not embedded into the host executable.
          The SC220 Live host remains under its own terms; do not assume licence compatibility without review.
          EOF
          (cd stage && zip -qr ../ArSonComp-v0.2.0-Windows-x64-VST3.zip .)
          sha256sum 'ArSonComp-v0.2.0-Windows-x64-VST3.zip' > SHA256SUMS.txt
          test -s 'ArSonComp-v0.2.0-Windows-x64-VST3.zip'
          unzip -tq 'ArSonComp-v0.2.0-Windows-x64-VST3.zip'
      - name: Publish version-pinned public engineering VST3 binary without mutating stable tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v0.2.0-sc220-vst3-test' --repo 'masarray/arson-comp' >/dev/null 2>&1; then
            echo "Immutable integration release exists; refusing to replace binaries."
            exit 1
          fi
          gh release create 'v0.2.0-sc220-vst3-test' 'ArSonComp-v0.2.0-Windows-x64-VST3.zip' SHA256SUMS.txt \
            --repo 'masarray/arson-comp' --target 'b1a8452a238bb237215788ed71b19e6e9d6c5f68' --prerelease \
            --title 'ArSonComp - SC220 Integration VST3 (v0.2.0 stable engine)' \
            --notes 'Independently licensed AGPL-3.0 Windows x64 VST3 exported from an already-passing Windows build. Includes source/run provenance, corresponding GitHub source commit, licence and checksums. Intended as an engineering test asset, not a claim of SC220+ASIO hardware approval.'
